<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telebob Trading Terminal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; }
    input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #0088cc; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 15px; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <h2>xRocket Terminal</h2>
  <div class="card">
    <label for="accessKey">Access Key Required</label>
    <input type="password" id="accessKey" placeholder="Enter Access Key">
    <button onclick="unlockTerminal()">Unlock Terminal</button>
    <div id="status"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    async function unlockTerminal() {
      const accessKey = document.getElementById('accessKey').value;
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = '#ccc';
      statusDiv.innerText = "Validating...";

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessKey })
        });
        const data = await res.json();
        if (data.success) {
          statusDiv.style.color = '#00ff88';
          statusDiv.innerText = "Terminal Unlocked!";
        } else {
          statusDiv.style.color = '#ff4444';
          statusDiv.innerText = data.error || "Access Denied";
        }
      } catch (err) {
        statusDiv.style.color = '#ff4444';
        statusDiv.innerText = "Connection Error";
      }
    }
  </script>
</body>
</html>
